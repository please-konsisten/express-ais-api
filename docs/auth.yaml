paths:
  /login:
    post:
      summary: "Login Pengguna"
      description: "Endpoint untuk masuk ke dalam aplikasi menggunakan username dan password."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "user_contoh"
                password:
                  type: string
                  example: "rahasia123"
      responses:
        200:
          description: "Login Sukses"
