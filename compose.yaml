services:
  app:
    build:
      context: .
      target: development
    container_name: ais-api-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://root:example@172.22.0.1:5432/db_ais?schema=public
      - REDIS_URL=redis://ais-redis-dev:6379  
    depends_on:
      - redis
    
  redis:
    container_name: ais-redis-dev
    image: redis:7-alpine
    ports:
      - "6379:6379"

networks:
  ais-network:
    external: true
    name: nest-12-ais-api_ais-network