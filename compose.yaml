services:
  app:
    build:
      context: .
      target: development
    container_name: ais-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://root:example@172.22.0.1:5432/db_ais?schema=public}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
    networks:
      - ais-network

  # Dipakai hanya saat dibutuhkan (install/hapus library).
  # Tidak ikut jalan pada `docker compose up`.
  node:
    image: node:26-slim
    profiles: ["tools"]
    user: node
    working_dir: /app
    volumes:
      - .:/app

volumes:
  node_modules:

networks:
  ais-network:
    external: true
    name: nest-12-ais-api_ais-network