services:
  app:
    build:
      context: .
      target: development
    container_name: ais-api-dev
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules 
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres:secretpassword@ais-db-dev:5432/mydb?schema=public
      REDIS_URL: redis://ais-redis-dev:6379 
    depends_on:
      - postgres-db
      - redis
    
  postgres-db:
    image: postgres:15-alpine
    container_name: ais-db-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: mydb
    volumes:
      - ais_db_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: ais-adminer-dev
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres-db
    depends_on:
      - postgres-db

  redis:
    container_name: ais-redis-dev
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  ais_db_data:
    name: ais-db-data